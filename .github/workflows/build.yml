name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: v5.8.0

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Verify application and manifests
        run: make verify

      - name: Audit locked dependencies
        run: npm audit --audit-level=high

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=sha-

      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Update future GitOps image references
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE_REF="${IMAGE}:${IMAGE_TAG}"
          for environment in k3d homelab; do
            (cd "deploy/overlays/${environment}" && \
              kustomize edit set image "${IMAGE}=${IMAGE_REF}")
          done
          make verify-manifests

      - name: Open image update pull request
        id: image-update-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/image-tag-${{ github.sha }}
          delete-branch: true
          commit-message: "chore: bump image to ${{ steps.meta.outputs.version }}"
          title: "chore: bump image to ${{ steps.meta.outputs.version }}"
          body: |
            Updates the pinned k3d and homelab image references to the immutable
            multi-architecture image published from `${{ github.sha }}`.

            The publishing workflow ran `make verify` and rendered all three
            overlays after applying this image reference.

      - name: Run CI on the generated image update branch
        if: steps.image-update-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_UPDATE_BRANCH: automation/image-tag-${{ github.sha }}
        run: gh workflow run ci.yml --ref "$IMAGE_UPDATE_BRANCH"
